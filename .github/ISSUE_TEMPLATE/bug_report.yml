name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Do not paste secrets** (passwords, tokens, encryption keys, connection strings, your server's host name). Security problems: use the private report link on the issue chooser instead.
  - type: dropdown
    id: component
    attributes:
      label: Component
      options: [Windows app, Android app, Server, Documentation, Other]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Shown in About (Windows) or Settings > About (Android).
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Windows version / Android version and phone model / server OS and Node version.
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. ...\n2. ...\n3. ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behaviour
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove anything private first.
